<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>عبدالله ترموم | Abdullah Tarmom - Portfolio</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            direction: rtl;
        }

        body.ltr {
            direction: ltr;
            text-align: left;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* ========== SIDEBAR (Desktop) ========== */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow-y: auto;
        }

        body.ltr .sidebar {
            right: auto;
            left: 0;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.1);
        }

        /* Sidebar Content */
        .profile {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: floatProfile 3s ease-in-out infinite;
        }

        @keyframes floatProfile {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .profile-img:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .profile-name {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3436;
        }

        .profile-title {
            font-size: 0.8rem;
            color: #667eea;
            margin-top: 5px;
        }

        /* Sidebar Navigation */
        .sidebar-nav {
            flex: 1;
            margin: 20px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #2d3436;
            font-weight: 500;
        }

        .nav-item i {
            width: 24px;
            font-size: 1.2rem;
            color: #667eea;
        }

        .nav-item:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateX(-5px);
        }

        body.ltr .nav-item:hover {
            transform: translateX(5px);
        }

        .nav-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .nav-item.active i {
            color: white;
        }

        /* Language Button Only */
        .btn-lang {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #e9ecef;
            color: #2d3436;
        }

        .btn-lang:hover {
            background: #dee2e6;
            transform: translateY(-2px);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: 30px;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }

        body.ltr .main-content {
            margin-right: 0;
            margin-left: 280px;
        }

        /* Content Cards */
        .content-card {
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            position: relative;
            color: #2d3436;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        body.ltr .section-title::after {
            right: auto;
            left: 0;
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
        }

        .hero-greeting {
            font-size: 1.1rem;
            color: #667eea;
            margin-bottom: 12px;
            animation: fadeInDown 0.6s ease;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-name {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: fadeInScale 0.6s ease;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero-badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.1);
            padding: 6px 18px;
            border-radius: 50px;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .hero-info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .hero-info-item {
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }

        .hero-info-item:hover {
            transform: translateY(-3px);
            background: #667eea;
            color: white;
        }

        .hero-info-item:hover i {
            color: white;
        }

        .hero-info-item i {
            color: #667eea;
            font-size: 0.9rem;
        }

        .hero-summary {
            margin-top: 25px;
            line-height: 1.7;
            color: #636e72;
            font-size: 0.95rem;
        }

        /* Skills & Certificates Grid */
        .skills-grid, .certs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .skill-card, .cert-card {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease backwards;
        }

        .skill-card:hover, .cert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            background: white;
        }

        .skill-card i, .cert-card i {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 12px;
        }

        .skill-card h3, .cert-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #2d3436;
        }

        .skill-card p, .cert-card p {
            color: #636e72;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .cert-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            margin-top: 8px;
        }

        /* ========== MOBILE BOTTOM NAVIGATION ========== */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.1);
            padding: 10px 20px;
            z-index: 200;
            justify-content: space-around;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #636e72;
            font-size: 0.7rem;
        }

        .mobile-nav-item i {
            font-size: 1.3rem;
            color: #636e72;
        }

        .mobile-nav-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .mobile-nav-item.active i {
            color: white;
        }

        .mobile-lang-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            background: #e9ecef;
            font-size: 0.7rem;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-right: 0;
                padding: 16px;
                padding-bottom: 80px;
            }

            body.ltr .main-content {
                margin-left: 0;
            }

            .content-card {
                padding: 20px;
            }

            .hero-name {
                font-size: 1.6rem;
            }

            .hero-info-grid {
                gap: 8px;
            }

            .hero-info-item {
                padding: 6px 12px;
                font-size: 0.75rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .skills-grid, .certs-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .mobile-bottom-nav {
                display: flex;
            }

            .profile-img {
                width: 90px;
                height: 90px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .sidebar {
                width: 240px;
                padding: 20px 15px;
            }
            .main-content {
                margin-right: 240px;
                padding: 20px;
            }
            body.ltr .main-content {
                margin-left: 240px;
            }
            .profile-img {
                width: 100px;
                height: 100px;
            }
            .hero-name {
                font-size: 1.9rem;
            }
        }

        /* Small phones */
        @media (max-width: 480px) {
            .hero-name {
                font-size: 1.3rem;
            }
            .hero-greeting {
                font-size: 0.9rem;
            }
            .hero-badge {
                font-size: 0.75rem;
            }
            .content-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body dir="rtl">
    <div class="app-container">
        <!-- Desktop Sidebar -->
        <aside class="sidebar">
            <div class="profile">
                <img src="abdullah.png" alt="Abdullah" class="profile-img" id="profileImg">
                <div>
                    <div class="profile-name" id="sidebarName"> عبدالله طرموم </div>
                    <div class="profile-title" id="sidebarTitle">طالب حاسبات</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" data-tab="hero">
                    <i class="fas fa-home"></i>
                    <span id="navHero">الرئيسية</span>
                </div>
                <div class="nav-item" data-tab="certificates">
                    <i class="fas fa-certificate"></i>
                    <span id="navCerts">الشهادات</span>
                </div>
                <div class="nav-item" data-tab="skills">
                    <i class="fas fa-code"></i>
                    <span id="navSkills">المهارات والكورسات</span>
                </div>
            </nav>
            <button class="btn-lang" id="langToggleBtn">
                <i class="fas fa-globe"></i> <span id="langToggleText">English</span>
            </button>
        </aside>

        <!-- Mobile Bottom Navigation -->
        <div class="mobile-bottom-nav" id="mobileBottomNav">
            <div class="mobile-nav-item active" data-tab="hero">
                <i class="fas fa-home"></i>
                <span id="mobileNavHero">الرئيسية</span>
            </div>
            <div class="mobile-nav-item" data-tab="certificates">
                <i class="fas fa-certificate"></i>
                <span id="mobileNavCerts">الشهادات</span>
            </div>
            <div class="mobile-nav-item" data-tab="skills">
                <i class="fas fa-code"></i>
                <span id="mobileNavSkills">المهارات</span>
            </div>
            <div class="mobile-lang-btn" id="mobileLangBtn">
                <i class="fas fa-globe"></i>
                <span id="mobileLangText">EN</span>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <div id="content-container" class="content-card">
                <!-- Content will be injected here dynamically -->
            </div>
        </main>
    </div>

    <script>
        // ========== DATA (Based on your CV) ==========
        const contentData = {
            ar: {
                hero: {
                    greeting: "مرحباً! أنا",
                    name: "عبدالله طرموم",
                    badge: "طالب حاسبات ومعلومات | جامعة عين شمس",
                    info: [
                        { icon: "fa-phone", text: "01111333412 (مصر)" },
                        { icon: "fa-phone", text: "773133130 (اليمن)" },
                        { icon: "fa-envelope", text: "abdullahtarmom2022@gmail.com" },
                        { icon: "fa-calendar", text: "22/4/2002 (24 سنة)" },
                        { icon: "fa-map-marker-alt", text: "الجيزة، مصر" },
                        { icon: "fa-flag", text: "يمني" }
                    ],
                    summary: "طالب متميز بمجال حاسبات والمعلومات، أسعى للعمل في قطاع الجمارك أو المجالات المرتبطة بالبيانات، لأوظف مهاراتي البرمجية والتحليلية في تطوير الأنظمة وإدارة البيانات بدقة وكفاءة."
                },
                certificates: {
                    title: "شهاداتي",
                    items: [
                        { icon: "fa-certificate", name: "شهادة اللغة الإنجليزية", issuer: "أكاديمية Courses Zone" },
                        { icon: "fa-certificate", name: "شهادة ICDL", issuer: "مهارات الحاسب الدولية" },
                        { icon: "fa-certificate", name: "شهادة البرمجة", issuer: "أساسيات البرمجة - Programming" }
                    ]
                },
                skills: {
                    title: "المهارات والكورسات",
                    categories: [
                        { name: "البرمجة", desc: "أساسيات C++ / Python، حل المشكلات برمجياً" },
                        { name: "مهارات الحاسب", desc: "ICDL، MS Office (Word, Excel, PowerPoint)" },
                        { name: "تحليل البيانات", desc: "دقة في التحليل، الاهتمام بالتفاصيل" },
                        { name: "اللغات", desc: "العربية (لغة أم)، الإنجليزية (جيد جداً)" },
                        { name: "المهارات الشخصية", desc: "تعلم سريع، العمل الجماعي، العمل تحت الضغط" }
                    ]
                }
            },
            en: {
                hero: {
                    greeting: "Hi! I'm",
                    name: "Abdullah Ali Abdullah Tarmom",
                    badge: "Computer Science Student | Ain Shams University",
                    info: [
                        { icon: "fa-phone", text: "01111333412 (Egypt)" },
                        { icon: "fa-phone", text: "773133130 (Yemen)" },
                        { icon: "fa-envelope", text: "abdullahtarmom2022@gmail.com" },
                        { icon: "fa-calendar", text: "22/4/2002 (24 years)" },
                        { icon: "fa-map-marker-alt", text: "Giza, Egypt" },
                        { icon: "fa-flag", text: "Yemeni" }
                    ],
                    summary: "Motivated Computer Science student with strong foundation in programming and data analysis. Seeking an entry-level opportunity in Customs or data-related roles to contribute to system improvement and efficient data management."
                },
                certificates: {
                    title: "My Certificates",
                    items: [
                        { icon: "fa-certificate", name: "English Language Certificate", issuer: "Courses Zone Academy" },
                        { icon: "fa-certificate", name: "ICDL Certificate", issuer: "International Computer Driving License" },
                        { icon: "fa-certificate", name: "Programming Certificate", issuer: "Programming Basics" }
                    ]
                },
                skills: {
                    title: "Skills & Courses",
                    categories: [
                        { name: "Programming", desc: "C++ / Python basics, problem-solving" },
                        { name: "Computer Skills", desc: "ICDL, MS Office (Word, Excel, PowerPoint)" },
                        { name: "Data Analysis", desc: "Accurate analysis, attention to detail" },
                        { name: "Languages", desc: "Arabic (Native), English (Good)" },
                        { name: "Soft Skills", desc: "Fast learning, teamwork, work under pressure" }
                    ]
                }
            }
        };

        let currentLang = 'ar';
        let currentTab = 'hero';

        // Render content based on current tab and language
        function renderContent() {
            const data = contentData[currentLang];
            const container = document.getElementById('content-container');
            
            if (currentTab === 'hero') {
                container.innerHTML = `
                    <div class="hero-section">
                        <div class="hero-greeting">${data.hero.greeting}</div>
                        <div class="hero-name">${data.hero.name}</div>
                        <div class="hero-badge">${data.hero.badge}</div>
                        <div class="hero-info-grid">
                            ${data.hero.info.map(info => `
                                <div class="hero-info-item">
                                    <i class="fas ${info.icon}"></i>
                                    <span>${info.text}</span>
                                </div>
                            `).join('')}
                        </div>
                        <p class="hero-summary">${data.hero.summary}</p>
                    </div>
                `;
            } 
            else if (currentTab === 'certificates') {
                container.innerHTML = `
                    <h2 class="section-title">${data.certificates.title}</h2>
                    <div class="certs-grid">
                        ${data.certificates.items.map((cert, idx) => `
                            <div class="cert-card" style="animation-delay: ${idx * 0.1}s">
                                <i class="fas ${cert.icon}"></i>
                                <h3>${cert.name}</h3>
                                <p>${cert.issuer}</p>
                                <div class="cert-badge">✓ معتمدة</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if (currentTab === 'skills') {
                container.innerHTML = `
                    <h2 class="section-title">${data.skills.title}</h2>
                    <div class="skills-grid">
                        ${data.skills.categories.map((skill, idx) => `
                            <div class="skill-card" style="animation-delay: ${idx * 0.1}s">
                                <i class="fas fa-star"></i>
                                <h3>${skill.name}</h3>
                                <p>${skill.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // Update all UI text
        function updateUILanguage() {
            const t = contentData[currentLang];
            
            // Desktop sidebar
            document.getElementById('navHero').innerText = currentLang === 'ar' ? 'الرئيسية' : 'Home';
            document.getElementById('navCerts').innerText = currentLang === 'ar' ? 'الشهادات' : 'Certificates';
            document.getElementById('navSkills').innerText = currentLang === 'ar' ? 'المهارات والكورسات' : 'Skills & Courses';
            document.getElementById('langToggleText').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            document.getElementById('sidebarName').innerText = currentLang === 'ar' ? 'عبدالله طرموم ' : 'Abdullah Tarmom';
            document.getElementById('sidebarTitle').innerText = currentLang === 'ar' ? 'طالب حاسبات' : 'CS Student';
            
            // Mobile bottom nav
            document.getElementById('mobileNavHero').innerText = currentLang === 'ar' ? 'الرئيسية' : 'Home';
            document.getElementById('mobileNavCerts').innerText = currentLang === 'ar' ? 'الشهادات' : 'Certificates';
            document.getElementById('mobileNavSkills').innerText = currentLang === 'ar' ? 'المهارات' : 'Skills';
            document.getElementById('mobileLangText').innerText = currentLang === 'ar' ? 'EN' : 'عربي';
            
            // Direction
            if (currentLang === 'ar') {
                document.body.dir = 'rtl';
                document.body.classList.remove('ltr');
            } else {
                document.body.dir = 'ltr';
                document.body.classList.add('ltr');
            }
            
            renderContent();
        }

        // Set active tab in both desktop and mobile
        function setActiveTab(tabId) {
            currentTab = tabId;
            
            // Desktop
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-tab') === tabId) {
                    item.classList.add('active');
                }
            });
            
            // Mobile
            document.querySelectorAll('.mobile-nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-tab') === tabId) {
                    item.classList.add('active');
                }
            });
            
            renderContent();
        }

        // Event Listeners
        function initEventListeners() {
            // Desktop nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    setActiveTab(item.getAttribute('data-tab'));
                });
            });
            
            // Mobile nav items
            document.querySelectorAll('.mobile-nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    setActiveTab(item.getAttribute('data-tab'));
                });
            });
            
            // Desktop language button
            document.getElementById('langToggleBtn').addEventListener('click', () => {
                currentLang = currentLang === 'ar' ? 'en' : 'ar';
                updateUILanguage();
            });
            
            // Mobile language button
            document.getElementById('mobileLangBtn').addEventListener('click', () => {
                currentLang = currentLang === 'ar' ? 'en' : 'ar';
                updateUILanguage();
            });
        }
        
        // Set profile image (change this URL to your actual image)
        const profileImg = document.getElementById('profileImg');
        // profileImg.src = "your-actual-image-url.jpg"; // <-- change this line
        
        // Initialize
        updateUILanguage();
        initEventListeners();
    </script>
</body>
</html>
